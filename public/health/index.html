<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Product health · Taliferro Tech</title>
<link rel="icon" href="/img/general/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/general/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/health/report.css">
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <a class="brand" href="/"><img src="/img/general/apple-touch-icon.png" alt="" width="36" height="36"><span>Taliferro Tech</span></a>
    <span class="sp"></span>
    <button class="theme" id="theme" type="button"></button>
  </header>

  <form class="gate" id="gate">
    <span class="kicker">Weekly product health</span>
    <h1>Enter the password</h1>
    <p>This report is for the Taliferro team and investors.</p>
    <input type="text" name="username" autocomplete="username" value="taliferro-health" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <button class="go" type="submit">Open report</button>
    <span class="msg" id="msg" role="status" aria-live="polite"></span>
  </form>

  <main id="report" hidden></main>
</div>
<script src="/health/report.js"></script>
</body>
</html>
